{% extends "base.html" %}
{% block title %}Novo Produto{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Cadastrar Novo Produto</h4>
            </div>
            <div class="card-body">
                <form id="formCadastroProduto">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome do Produto *</label>
                        <input type="text" class="form-control" id="nome" required minlength="2" maxlength="100" placeholder="Ex: Papel Sulfite A4">
                    </div>
                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoria</label>
                        <input type="text" class="form-control" id="categoria" placeholder="Ex: Material de Expediente">
                    </div>
                    <div class="col-md-4 mb-3">
                            <label for="estoque_minimo" class="form-label">Estoque Mínimo</label>
                            <input type="number" class="form-control" id="estoque_minimo" value="0" min="0" title="Avisa quando o estoque chegar neste valor">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Outras Informações / Descrição</label>
                        <textarea class="form-control" id="descricao" rows="3"></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Salvar Produto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('formCadastroProduto').addEventListener('submit', async function(event) {
    event.preventDefault();
    const payload = {
        nome: document.getElementById('nome').value,
        categoria: document.getElementById('categoria').value || null,
        descricao: document.getElementById('descricao').value || null
    };
    try {
        const response = await fetch('/produtos/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (response.ok) {
            alert('Produto cadastrado com sucesso!');
            window.location.href = '/produtos/html/lista';
        } else {
            const erro = await response.json();
            alert('Erro: ' + JSON.stringify(erro.detail || erro));
        }
    } catch (error) {
        alert('Falha na comunicação.');
    }
});
</script>
{% endblock %}
