{% extends "base.html" %}
{% block title %}Editar Produto{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow-sm border-info">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Editar Produto #{{ produto.id }}</h4>
            </div>
            <div class="card-body bg-light">
                <form id="formEditarProduto">
                    <input type="hidden" id="produto_id" value="{{ produto.id }}">

                    <div class="mb-3">
                        <label for="nome" class="form-label fw-bold">Nome do Produto *</label>
                        <input type="text" class="form-control border-info" id="nome" required minlength="2" maxlength="100" value="{{ produto.nome }}">
                    </div>
                   <div class="row">
                        <div class="col-md-8 mb-3">
                            <label for="categoria" class="form-label fw-bold">Categoria</label>
                            <input type="text" class="form-control" id="categoria" value="{{ produto.categoria or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="estoque_minimo" class="form-label fw-bold">Estoque Mín.</label>
                            <input type="number" class="form-control border-info" id="estoque_minimo" value="{{ produto.estoque_minimo }}" min="0">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="descricao" class="form-label fw-bold">Outras Informações / Descrição</label>
                        <textarea class="form-control" id="descricao" rows="3">{{ produto.descricao or '' }}</textarea>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="/produtos/html/lista" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-info text-white px-5 fw-bold"><i class="bi bi-save"></i> Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('formEditarProduto').addEventListener('submit', async function(event) {
    event.preventDefault();
    const produtoId = document.getElementById('produto_id').value;
    const payload = {
        nome: document.getElementById('nome').value,
        categoria: document.getElementById('categoria').value || null,
        descricao: document.getElementById('descricao').value || null
    };

    try {
        const response = await fetch(`/produtos/${produtoId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (response.ok) {
            alert('Produto atualizado com sucesso!');
            window.location.href = '/produtos/html/lista';
        } else {
            const erro = await response.json();
            alert('Erro ao atualizar: ' + JSON.stringify(erro.detail || erro));
        }
    } catch (error) {
        alert('Falha na comunicação com o servidor.');
    }
});
</script>
{% endblock %}
