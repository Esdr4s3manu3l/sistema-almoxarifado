{% extends "base.html" %}
{% set active_page = "produtos" %}

{% block content %}
<div class="view-header">
  <div>
    <h2 class="page-title">Editar Produto: {{ produto.nome }}</h2>
    <p class="page-subtitle">Atualize as informações cadastrais do material.</p>
  </div>
  <a href="/produtos/html/lista" class="btn btn-secondary">Voltar</a>
</div>

<div class="card panel-card" style="max-width: 750px;">
  <form id="form-editar-produto" data-id="{{ produto.id }}">
    <div class="form-grid">
      <div class="form-group full-width">
        <label>Nome do Produto</label>
        <input type="text" name="nome" class="form-control" value="{{ produto.nome }}" required />
      </div>
      <div class="form-group">
        <label>Categoria</label>
        <input type="text" name="categoria" class="form-control" value="{{ produto.categoria if produto.categoria else '' }}" />
      </div>
      <div class="form-group">
        <label>Estoque Mínimo</label>
        <input type="number" name="estoque_minimo" class="form-control" value="{{ produto.estoque_minimo }}" required />
      </div>
    </div>
    <div class="form-group full-width">
      <label>Descrição Detalhada</label>
      <textarea name="descricao" class="form-control" rows="3">{{ produto.descricao if produto.descricao else '' }}</textarea>
    </div>
    <div class="modal-footer" style="padding-top: 1rem;">
      <button type="submit" class="btn btn-dark-blue">Salvar Alterações</button>
    </div>
  </form>
</div>
{% endblock %}
