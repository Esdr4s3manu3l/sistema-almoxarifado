<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Almoxarifado{% endblock %}</title>
    
    <!-- Bootstrap CSS e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- SEU CSS LOCAL (Opcional) -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body class="bg-light">
    <!-- BARRA DE NAVEGAÇÃO -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="bi bi-box-seam"></i> Almoxarifado</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/produtos/html/lista">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/movimentacoes/html/entrada">Entrada (NF-e)</a></li>
                    <li class="nav-item"><a class="nav-link" href="/movimentacoes/html/saida">Saída (Distribuição)</a></li>
                    <li class="nav-item"><a class="nav-link" href="/setores/html/cadastro">Setores</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" href="/relatorios/html/setores">Relatórios</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO DA PÁGINA -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SEU JS LOCAL (Opcional) -->
    <script src="{{ url_for('static', path='/js/main.js') }}"></script>
</body>
</html>
